name: Download counts

on:
  # Refresh every day so the lifetime download badges and the Progressor video link stay current
  schedule: [{ cron: "37 4 * * *" }]
  workflow_dispatch:

jobs:
  downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update download counts and the Progressor video link
        run: .github/scripts/download-counts.sh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/downloads README.md
          git diff --cached --quiet || git commit -m "chore(downloads): update download counts and video link [skip ci]"
          git push
